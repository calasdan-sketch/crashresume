[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crashresume"
version = "0.3.0"
description = "Conformance harness that proves an agent survives crash/restart without losing state or replaying effects"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "calasdan-sketch" }]
keywords = ["agents", "conformance", "crash", "resume", "idempotency", "pytest", "recovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pytest",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
crashresume = "crashresume.cli:main"

[project.entry-points.pytest11]
crashresume = "crashresume.pytest_plugin"

[project.urls]
Homepage = "https://github.com/calasdan-sketch/crashresume"
Source = "https://github.com/calasdan-sketch/crashresume"
Changelog = "https://github.com/calasdan-sketch/crashresume/blob/main/CHANGELOG.md"
Issues = "https://github.com/calasdan-sketch/crashresume/issues"

[tool.setuptools.package-data]
crashresume = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.setuptools.packages.find]
where = ["src"]
