name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . pytest build twine
      - name: Test
        run: pytest -q
      - name: CLI smoke
        run: crashresume --version
      - name: Build
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Self-test demo
        run: crashresume --selftest

